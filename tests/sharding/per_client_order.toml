# Each client's transactions must be applied in file order, even when they
# are interleaved with other clients'. Clients 1 and 5 share a shard
# (1 % 4 == 5 % 4), client 2 is on another one.
#
# Every result below depends on order:
# - client 1: the resolve must come before the final withdrawal of 6,
#   otherwise available is -4 and the withdrawal is refused (ends at 6).
# - client 5: the chargeback locks the account before the deposit of 100,
#   otherwise the deposit is credited (ends at 100).
# - client 2: dispute then chargeback removes the 30 and locks it.
#
# Expected: 1 -> 0 / 0 / 0 unlocked, 2 -> 1 / 0 / 1 locked,
#           5 -> 0 / 0 / 0 locked.
shards = 4

csv = """
type,client,tx,amount
deposit,1,1,10
deposit,5,2,20
deposit,2,3,30
withdrawal,1,4,4
dispute,5,2,
dispute,1,1,
deposit,2,5,1
resolve,1,1,
chargeback,5,2,
deposit,5,6,100
dispute,2,3,
chargeback,2,3,
withdrawal,1,7,6
"""

[env]
RUST_LOG = "off"
