# Valid CSV with newlines inside quoted fields, split into 3-byte blocks parsed
# by 4 threads. Blocks are only cut at a newline outside quotes, so each record
# is parsed whole, exactly as with a single block.
#
# Expected: 1 -> 5 available / 10 held (tx 1 disputed; `"res""\nolve"` is not
# a known type, so the resolve is rejected), 2 -> 7 (the withdrawal of 1 comes
# before the deposit and is refused), 3 -> 2.

csv = """
type,client,tx,amount
deposit,1,1,10
deposit,1,2,"5
"
"dispute",1,1,
"res""
olve",1,1,
withdrawal,2,3,"

1"
deposit,2,4,"7"
deposit,3,5,"2
"
"""

[env]
PAYENGINE_BLOCK_SIZE = "3"
PAYENGINE_PARSERS = "4"
