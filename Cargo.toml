[package]
name = "payengine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
ariadne = "0.6.0"
csv = "1.4.0"
flume = "0.12.0"
foldhash = "0.2.0"
rust_decimal = { version = "1.43.0", features = ["serde", "macros", "serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
libtest-mimic = "0.8.2"
glob = "0.3.4"
insta = "1.49.0"
vte = "0.15.0"
duct = { version = "1.1.2", features = ["timeout"] }
toml = "1.1.8"
micromeasure = "0.16.0"

[[test]]
name = "e2e_snapshot"
path = "tests/e2e.rs"
harness = false

[[bench]]
name = "engine"
harness = false

# Release build with debug symbols, so profiles show function names.
[profile.profiling]
inherits = "release"
debug = true
