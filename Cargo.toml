[package]
name = "payengine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ariadne = "0.6.0"
csv = "1.4.0"
rust_decimal = { version = "1.43.0", features = ["serde", "macros", "serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
libtest-mimic = "0.8.2"
glob = "0.3.4"
insta = "1.49.0"
vte = "0.15.0"
duct = { version = "1.1", features = ["timeout"] }
toml = "1.1.8"

[[test]]
name = "e2e_snapshot"
path = "tests/e2e.rs"
harness = false
